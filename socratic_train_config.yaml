# 使用 GSM8K socratic 子集 + 研究用 prompt 做 SFT（Qwen2.5-3B-Instruct, M3 Mac）
# 執行: llamafactory-cli train socratic_train_config.yaml
# 需先跑: python prepare_socratic_dataset.py

model_name_or_path: Qwen/Qwen2.5-3B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all

dataset: gsm8k_socratic_train
dataset_dir: data/custom
template: qwen
cutoff_len: 512
max_samples: 500

output_dir: outputs/gsm8k_socratic_qwen
overwrite_output_dir: true  # 從頭訓練，不從 checkpoint 恢復（換新 instruction 時必用）
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03

bf16: true
logging_steps: 5
save_steps: 100
plot_loss: true
include_num_input_tokens_seen: true
